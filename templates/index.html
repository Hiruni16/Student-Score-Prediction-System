<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Score Predictor | AI-Powered Analytics</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            color: white;
            position: relative;
            padding: 20px;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(circle at 20% 50%, rgba(99, 102, 241, 0.1) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.1) 0%, transparent 50%);
            pointer-events: none;
        }

        .back-button {
            position: absolute;
            top: 30px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            color: #818cf8;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .back-button:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: #6366f1;
            transform: translateX(-3px);
        }

        .back-button::before {
            content: "←";
            font-size: 18px;
        }

        .container {
            max-width: 1000px;
            margin: 80px auto 40px;
            position: relative;
            z-index: 1;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #fafafb, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            color: #cbd5e1;
            font-size: 16px;
        }

        .card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        label::before {
            content: "•";
            color: #6366f1;
            font-size: 18px;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        input::placeholder {
            color: #64748b;
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #1e293b;
            color: white;
        }

        .button-group {
            display: flex;
            gap: 16px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 14px 32px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-predict {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.5);
        }

        .btn-predict::after {
            content: "→";
            font-size: 18px;
        }

        .btn-clear {
            background: rgba(99, 102, 241, 0.1);
            color: #818cf8;
            border: 2px solid rgba(99, 102, 241, 0.3);
        }

        .btn-clear:hover {
            background: rgba(99, 102, 241, 0.2);
            border-color: #6366f1;
        }

        .result {
            margin-top: 30px;
            padding: 24px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(139, 92, 246, 0.15));
            border: 2px solid rgba(99, 102, 241, 0.4);
            border-radius: 12px;
            text-align: center;
        }

        .result-label {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .result-value {
            font-size: 48px;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .result-subtitle {
            margin-top: 8px;
            font-size: 14px;
            color: #94a3b8;
        }

        @media (max-width: 768px) {
            .back-button {
                top: 20px;
                left: 20px;
                padding: 8px 16px;
                font-size: 13px;
            }

            .container {
                margin-top: 70px;
            }

            .header h1 {
                font-size: 32px;
            }

            .card {
                padding: 30px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .button-group {
                flex-direction: column;
            }

            .result-value {
                font-size: 36px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header h1 {
                font-size: 28px;
            }

            .card {
                padding: 25px 16px;
            }
        }
    </style>
</head>
<body>

<a href="/" class="back-button">Back to Home</a>

<div class="container">
    <div class="header">
        <h1>Student Score Predictor</h1>
        <p>Enter your academic details to get an AI-powered score prediction</p>
    </div>

    <div class="card">
        <form action="/predict" method="post">
            <div class="form-grid">
                <div class="form-group">
                    <label>Age</label>
                    <input type="number" name="age" placeholder="e.g., 20" required>
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="">Select Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>Course</label>
                    <input type="text" name="course" placeholder="e.g., Computer Science" required>
                </div>

                <div class="form-group">
                    <label>Study Hours (per day)</label>
                    <input type="number" step="0.5" name="study_hours" placeholder="e.g., 5.5" required>
                </div>

                <div class="form-group">
                    <label>Class Attendance (%)</label>
                    <input type="number" step="0.1" name="class_attendance" placeholder="e.g., 85" min="0" max="100" required>
                </div>

                <div class="form-group">
                    <label>Internet Access</label>
                    <select name="internet_access" required>
                        <option value="">Select Option</option>
                        <option value="yes">Yes</option>
                        <option value="no">No</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Sleep Hours (per day)</label>
                    <input type="number" step="0.5" name="sleep_hours" placeholder="e.g., 7" required>
                </div>

                <div class="form-group">
                    <label>Sleep Quality</label>
                    <select name="sleep_quality" required>
                        <option value="">Select Quality</option>
                        <option value="poor">Poor</option>
                        <option value="average">Average</option>
                        <option value="good">Good</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Study Method</label>
                    <select name="study_method" required>
                        <option value="">Select Method</option>
                        <option value="self-study">Self Study</option>
                        <option value="online videos">Online Videos</option>
                        <option value="group study">Group Study</option>
                        <option value="coaching">Coaching</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Facility Rating</label>
                    <select name="facility_rating" required>
                        <option value="">Select Rating</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Exam Difficulty</label>
                    <select name="exam_difficulty" required>
                        <option value="">Select Difficulty</option>
                        <option value="easy">Easy</option>
                        <option value="moderate">Moderate</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-predict">Predict Score</button>
                <button type="reset" class="btn-clear">Clear Form</button>
                <a href="/history" class="btn-clear" style="text-align:center; display:flex; align-items:center; justify-content:center; text-decoration:none;">View History</a>
            </div>
        </form>

        {% if prediction %}
        <div class="result">
            <div class="result-label">Predicted Score</div>
            <div class="result-value">{{ prediction }}</div>
            <div class="result-subtitle">Based on your academic profile and study patterns</div>
        </div>
        {% endif %}
    </div>
</div>

</body>
</html>
